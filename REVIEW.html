ter its night actions and decide whom to accuse or vote for. Statements about roles and actions are reports that may be disputed or strategic. Preserve the distinction between a reported initial role, a role after a reported exchange, and a current role. Use the publicly spoken instructions in this prefix for the variant; do not infer hidden cards or final votes.", "participants": [{"participant_id": "Audio", "known_role": "recorded_audio_not_player"}, {"participant_id": "Justin", "known_role": null}, {"participant_id": "James", "known_role": null}, {"participant_id": "Mitchell", "known_role": null}, {"participant_id": "Alvin", "known_role": null}], "context_sources": [{"source_id": "WW01_public_instructions", "text": "Everyone, close your eyes. Werewolves, wake up and look for other werewolves.\nIf there is only one werewolf, you may look at a card from the center. Werewolves, close your eyes. Seer, wake up. You may look at another player's card or two of the center cards. Seer, close your eyes. Robber, wake up. You may exchange your card with another player's card and then view your new card.\nRobber, close your eyes. Troublemaker, wake up. You may exchange cards between two other players.\nTroublemaker, close your eyes. Everyone, keep your eyes closed and reach out and move your card around slightly.\nEveryone, wake up.", "accessible_to_participants": ["Justin", "James", "Mitchell", "Alvin"], "adapter": {"kind": "game_rules", "review_status": "verified", "roles": ["Werewolf", "Villager", "Seer", "Robber", "Troublemaker", "Mason", "Drunk", "Insomniac", "Minion", "Tanner"]}}], "dialogue_prefix": [{"utterance_id": "WW01.row.001", "speaker": "Audio", "text": "Everyone, close your eyes. Werewolves, wake up and look for other werewolves."}, {"utterance_id": "WW01.row.002", "speaker": "Justin", "text": "I love this guy."}, {"utterance_id": "WW01.row.003", "speaker": "Audio", "text": "If there is only one werewolf, you may look at a card from the center. Werewolves, close your eyes. Seer, wake up. You may look at another player's card or two of the center cards. Seer, close your eyes. Robber, wake up. You may exchange your card with another player's card and then view your new card."}, {"utterance_id": "WW01.row.004", "speaker": "James", "text": "This is chaos."}, {"utterance_id": "WW01.row.005", "speaker": "Justin", "text": "Yeah the Robber's a dick. He just comes in and like, I need to get a."}, {"utterance_id": "WW01.row.006", "speaker": "James", "text": "The Seer's like, I know."}, {"utterance_id": "WW01.row.007", "speaker": "Audio", "text": "Robber, close your eyes. Troublemaker, wake up. You may exchange cards between two other players."}, {"utterance_id": "WW01.row.008", "speaker": "James", "text": "Make it right. Whatever the Robber took, give it back."}, {"utterance_id": "WW01.row.009", "speaker": "Audio", "text": "Troublemaker, close your eyes. Everyone, keep your eyes closed and reach out and move your card around slightly."}, {"utterance_id": "WW01.row.010", "speaker": "Justin", "text": "This is my favorite part of the game."}, {"utterance_id": "WW01.row.011", "speaker": "Mitchell", "text": "Yeah. Okay, we did it."}, {"utterance_id": "WW01.row.012", "speaker": "Justin", "text": "Yeah, we're good. We're good."}, {"utterance_id": "WW01.row.013", "speaker": "Audio", "text": "Everyone, wake up."}, {"utterance_id": "WW01.row.014", "speaker": "Mitchell", "text": "I love that, \"Wake up.\""}, {"utterance_id": "WW01.row.015", "speaker": "Alvin", "text": "They give you so much time for the last one."}, {"utterance_id": "WW01.row.016", "speaker": "Mitchell", "text": "Next time we play, I can shorten the time that he gives everyone. Now that you get more comfortable with it."}, {"utterance_id": "WW01.row.017", "speaker": "Justin", "text": "We're doing this."}, {"utterance_id": "WW01.row.018", "speaker": "James", "text": "Yeah. Mitchell, again?"}, {"utterance_id": "WW01.row.019", "speaker": "Mitchell", "text": "Let's get some information flowing here."}, {"utterance_id": "WW01.row.020", "speaker": "Justin", "text": "All right. Who's going to start? You're the one on the fucking..."}, {"utterance_id": "WW01.row.021", "speaker": "Mitchell", "text": "I started as a Villager. That's what I was."}, {"utterance_id": "WW01.row.022", "speaker": "James", "text": "That's what I was too. I did nothing."}, {"utterance_id": "WW01.row.023", "speaker": "Alvin", "text": "Really?"}, {"utterance_id": "WW01.row.024", "speaker": "James", "text": "I kept my eyes closed the whole time."}, {"utterance_id": "WW01.row.025", "speaker": "Alvin", "text": "Really?"}, {"utterance_id": "WW01.row.026", "speaker": "James", "text": "Yeah. And chatted, I chatted a little. That's because I'm not a good villager. I don't sleep at night."}, {"utterance_id": "WW01.row.027", "speaker": "Justin", "text": "It's funny you say that because as the Troublemaker, I switched your guys' cards."}, {"utterance_id": "WW01.row.028", "speaker": "Alvin", "text": "Okay. What?"}]}}, {"case_id": "WW02_WW02_r040", "observer_input_sha256": "3c688b718ec2d9e3afb81a8c7f6f10c7f5318199233610466a967aa1f98f7ec1", "observer_input": {"overall_task": "Participants discuss a One Night Ultimate Werewolf game after its night actions and decide whom to accuse or vote for. Statements about roles and actions are reports that may be disputed or strategic. Preserve the distinction between a reported initial role, a role after a reported exchange, and a current role. Use the publicly spoken instructions in this prefix for the variant; do not infer hidden cards or final votes.", "participants": [{"participant_id": "Audio", "known_role": "recorded_audio_not_player"}, {"participant_id": "Justin", "known_role": null}, {"participant_id": "Mitchell", "known_role": null}, {"participant_id": "Dan", "known_role": null}, {"participant_id": "Caitlynn", "known_role": null}, {"participant_id": "Mike", "known_role": null}], "context_sources": [{"source_id": "WW02_public_instructions", "text": "Everyone close your eyes. Werewolves, wake up and look for other Werewolves. If there is only one Werewolf, you may look at a card from the center. Werewolves, close your eyes. Seer, wake up. You may look at another player's card, or two of the center cards. Seer, close your eyes. Robber, wake up.\nYou may exchange your card with another player's card, and then view your new card. Robber, close your eyes. Troublemaker, wake up. You may exchange cards between two other players. Troublemaker, close your eyes. Everyone, keep your eyes closed, and reach out and move your card around slightly.\nWake up.", "accessible_to_participants": ["Justin", "Mitchell", "Dan", "Caitlynn", "Mike"], "adapter": {"kind": "game_rules", "review_status": "verified", "roles": ["Werewolf", "Villager", "Seer", "Robber", "Troublemaker", "Mason", "Drunk", "Insomniac", "Minion", "Tanner"]}}], "dialogue_prefix": [{"utterance_id": "WW02.row.001", "speaker": "Audio", "text": "Everyone close your eyes. Werewolves, wake up and look for other Werewolves. If there is only one Werewolf, you may look at a card from the center. Werewolves, close your eyes. Seer, wake up. You may look at another player's card, or two of the center cards. Seer, close your eyes. Robber, wake up."}, {"utterance_id": "WW02.row.002", "speaker": "Justin", "text": "Robber."}, {"utterance_id": "WW02.row.003", "speaker": "Audio", "text": "You may exchange your card with another player's card, and then view your new card. Robber, close your eyes. Troublemaker, wake up. You may exchange cards between two other players. Troublemaker, close your eyes. Everyone, keep your eyes closed, and reach out and move your card around slightly."}, {"utterance_id": "WW02.row.004", "speaker": "Justin", "text": "Yes."}, {"utterance_id": "WW02.row.005", "speaker": "Audio", "text": "Wake up."}, {"utterance_id": "WW02.row.006", "speaker": "Justin", "text": "All right, now we have five minutes to talk."}, {"utterance_id": "WW02.row.007", "speaker": "Mitchell", "text": "And you don't look at your card."}, {"utterance_id": "WW02.row.008", "speaker": "Justin", "text": "Yeah. You don't look at your card."}, {"utterance_id": "WW02.row.009", "speaker": "Dan", "text": "No, no. Just leave it."}, {"utterance_id": "WW02.row.010", "speaker": "Mitchell", "text": "So you might not..."}, {"utterance_id": "WW02.row.011", "speaker": "Caitlynn", "text": "I was just going to absentmindedly play with them, I'm sorry."}, {"utterance_id": "WW02.row.012", "speaker": "Mitchell", "text": "You might not be who you thought, who you think you are."}, {"utterance_id": "WW02.row.013", "speaker": "Justin", "text": "So does anyone want to declare anything?"}, {"utterance_id": "WW02.row.014", "speaker": "Dan", "text": "I'll wait until someone else first."}, {"utterance_id": "WW02.row.015", "speaker": "Justin", "text": "I'm going to say I was the Robber."}, {"utterance_id": "WW02.row.016", "speaker": "Dan", "text": "But I could take that from you, right?"}, {"utterance_id": "WW02.row.017", "speaker": "Mitchell", "text": "I was the Seer. I know of one person, what their card was. So do not lie to me."}, {"utterance_id": "WW02.row.018", "speaker": "Mike", "text": "But it could have been switched."}, {"utterance_id": "WW02.row.019", "speaker": "Mitchell", "text": "Well, I played my Seer role, so I did look at a card."}, {"utterance_id": "WW02.row.020", "speaker": "Justin", "text": "Caitlynn's saying she's a Villager? Dan, did you switch anyone's cards around?"}, {"utterance_id": "WW02.row.021", "speaker": "Dan", "text": "Yes."}, {"utterance_id": "WW02.row.022", "speaker": "Mike", "text": "Who?"}, {"utterance_id": "WW02.row.023", "speaker": "Justin", "text": "Whose did you switch?"}, {"utterance_id": "WW02.row.024", "speaker": "Mitchell", "text": "Maybe wait til Mike..."}, {"utterance_id": "WW02.row.025", "speaker": "Justin", "text": "Yeah. Mike. Yeah. What are you? A Villager. So we got Villager, Villager, Seer, Troublemaker, Driver. So we currently have no Werewolves. It is possible to have no Werewolves. Dan, who did you switch around?"}, {"utterance_id": "WW02.row.026", "speaker": "Dan", "text": "Whose card did you take? "}, {"utterance_id": "WW02.row.027", "speaker": "Justin", "text": "I took the logic of trying to not, just to stay on the side of the village, as we said. So I did not switch with anybody. I'm still the Robber."}, {"utterance_id": "WW02.row.028", "speaker": "Mitchell", "text": "It's possible, he switched with someone, looked at the card, and it turns out to be a Werewolf. And now, he's trying to play innocent."}, {"utterance_id": "WW02.row.029", "speaker": "Justin", "text": "It's possible."}, {"utterance_id": "WW02.row.030", "speaker": "Mitchell", "text": "Possible."}, {"utterance_id": "WW02.row.031", "speaker": "Justin", "text": "Can I know either who you swapped with, or who you looked at?"}, {"utterance_id": "WW02.row.032", "speaker": "Mitchell", "text": "I just say the person I looked at, is being honest right now. I'll start with that."}, {"utterance_id": "WW02.row.033", "speaker": "Justin", "text": "Okay. That's fair."}, {"utterance_id": "WW02.row.034", "speaker": "Mitchell", "text": "A tidbit."}, {"utterance_id": "WW02.row.035", "speaker": "Mike", "text": "Okay."}, {"utterance_id": "WW02.row.036", "speaker": "Dan", "text": "Okay. I switched Caitlynn and Justin."}, {"utterance_id": "WW02.row.037", "speaker": "Justin", "text": "No lie?"}, {"utterance_id": "WW02.row.038", "speaker": "Dan", "text": "No lie."}, {"utterance_id": "WW02.row.039", "speaker": "Justin", "text": "All right. Caitlynn's a Werewolf."}, {"utterance_id": "WW02.row.040", "speaker": "Dan", "text": "I think that she is a Werewolf."}]}}, {"case_id": "WW03_WW03_r078", "observer_input_sha256": "05a28d6888862f27c0d31eaa155d3edaf7fe470dbd7493f1697f1241ba3bf339", "observer_input": {"overall_task": "Participants discuss a One Night Ultimate Werewolf game after its night actions and decide whom to accuse or vote for. Statements about roles and actions are reports that may be disputed or strategic. Preserve the distinction between a reported initial role, a role after a reported exchange, and a current role. Use the publicly spoken instructions in this prefix for the variant; do not infer hidden cards or final votes.", "participants": [{"participant_id": "Audio", "known_role": "recorded_audio_not_player"}, {"participant_id": "James", "known_role": null}, {"participant_id": "Mike", "known_role": null}, {"participant_id": "Justin", "known_role": null}, {"participant_id": "Mitchell", "known_role": null}], "context_sources": [{"source_id": "WW03_public_instructions", "text": "Everyone, close your eyes.\nWerewolves, wake up and look for other werewolves. (Still more laughter) If there is only one-\nYou may look at a card from the center. Werewolves, close your eyes. Seer, wake up. You may look at another players' card or two of the center cards.\nSeer, close your eyes. Robber, wake up.\nYou may exchange your card with another players' card and then view your new card.\nRobber, close your eyes. Insomniac, wake up and look at your card.\nInsomniac, close your eyes. Everyone, keep your eyes closed and reach out and move your card around slightly.\nEveryone, wake up.", "accessible_to_participants": ["James", "Mike", "Justin", "Mitchell"], "adapter": {"kind": "game_rules", "review_status": "verified", "roles": ["Werewolf", "Villager", "Seer", "Robber", "Troublemaker", "Mason", "Drunk", "Insomniac", "Minion", "Tanner"]}}], "dialogue_prefix": [{"utterance_id": "WW03.row.001", "speaker": "Audio", "text": "Everyone, close your eyes."}, {"utterance_id": "WW03.row.002", "speaker": "James", "text": "Oh god, we've made a mistake. (laughter)"}, {"utterance_id": "WW03.row.003", "speaker": "Audio", "text": "Werewolves, wake up and look for other werewolves. (Still more laughter) If there is only one-"}, {"utterance_id": "WW03.row.004", "speaker": "Mike", "text": "-There's two right?"}, {"utterance_id": "WW03.row.005", "speaker": "Audio", "text": "You may look at a card from the center. Werewolves, close your eyes. Seer, wake up. You may look at another players' card or two of the center cards."}, {"utterance_id": "WW03.row.006", "speaker": "Justin", "text": "I feel like I'm cheating on a girlfriend right now. But it's like the normal voice dude."}, {"utterance_id": "WW03.row.007", "speaker": "Audio", "text": "Seer, close your eyes. Robber, wake up."}, {"utterance_id": "WW03.row.008", "speaker": "Justin", "text": "\"Rubber.\""}, {"utterance_id": "WW03.row.009", "speaker": "Mike", "text": "\"Rubber!\""}, {"utterance_id": "WW03.row.010", "speaker": "James", "text": "\"Rubber.\""}, {"utterance_id": "WW03.row.011", "speaker": "Mitchell", "text": "\"Rubber.\""}, {"utterance_id": "WW03.row.012", "speaker": "Mike", "text": "It keeps saying \"rubber.\""}, {"utterance_id": "WW03.row.013", "speaker": "Audio", "text": "You may exchange your card with another players' card and then view your new card."}, {"utterance_id": "WW03.row.014", "speaker": "Justin", "text": "\"Rubber.\""}, {"utterance_id": "WW03.row.015", "speaker": "Mike", "text": "\"Rubber.\""}, {"utterance_id": "WW03.row.016", "speaker": "Justin", "text": "\"Robber.\" I like this horror more."}, {"utterance_id": "WW03.row.017", "speaker": "James", "text": "No, I like the strings."}, {"utterance_id": "WW03.row.018", "speaker": "Justin", "text": "Yeah, you're a butt."}, {"utterance_id": "WW03.row.019", "speaker": "Audio", "text": "Robber, close your eyes. Insomniac, wake up and look at your card."}, {"utterance_id": "WW03.row.020", "speaker": "Justin", "text": "I'm blaming you for that last loss. (Laughter)"}, {"utterance_id": "WW03.row.021", "speaker": "James", "text": "You just straight-up cheated."}, {"utterance_id": "WW03.row.022", "speaker": "Audio", "text": "Insomniac, close your eyes. Everyone, keep your eyes closed and reach out and move your card around slightly."}, {"utterance_id": "WW03.row.023", "speaker": "Justin", "text": "Goddamn, this is why you play boardgames."}, {"utterance_id": "WW03.row.024", "speaker": "Audio", "text": "Everyone, wake up."}, {"utterance_id": "WW03.row.025", "speaker": "Justin", "text": "Oh, she also did the voice of Tiny Tina."}, {"utterance_id": "WW03.row.026", "speaker": "James", "text": "Oh."}, {"utterance_id": "WW03.row.027", "speaker": "Mike", "text": "Who?"}, {"utterance_id": "WW03.row.028", "speaker": "Justin", "text": "It's Ash from Hey Ash, what are you playing?"}, {"utterance_id": "WW03.row.029", "speaker": "James", "text": "I don't know that."}, {"utterance_id": "WW03.row.030", "speaker": "Mitchell", "text": "Any minute now James is going to suggest you put her in the slambulance."}, {"utterance_id": "WW03.row.031", "speaker": "James", "text": "No one's made a call."}, {"utterance_id": "WW03.row.032", "speaker": "Justin", "text": "I was a villager."}, {"utterance_id": "WW03.row.033", "speaker": "Mike", "text": "I don't blame you on that."}, {"utterance_id": "WW03.row.034", "speaker": "James", "text": "I'm going to go ahead and see that."}, {"utterance_id": "WW03.row.035", "speaker": "Mitchell", "text": "What did you see?"}, {"utterance_id": "WW03.row.036", "speaker": "Justin", "text": "We all put one down."}, {"utterance_id": "WW03.row.037", "speaker": "James", "text": "Yeah."}, {"utterance_id": "WW03.row.038", "speaker": "Justin", "text": "Put down any of them. We don't even care what they are. All right, what did you look at?"}, {"utterance_id": "WW03.row.039", "speaker": "James", "text": "What did I look at, was..."}, {"utterance_id": "WW03.row.040", "speaker": "Justin", "text": "Did you steal from somebody?"}, {"utterance_id": "WW03.row.041", "speaker": "James", "text": "Someone boring."}, {"utterance_id": "WW03.row.042", "speaker": "Justin", "text": "Okay, I get that."}, {"utterance_id": "WW03.row.043", "speaker": "Mike", "text": "Who was it?"}, {"utterance_id": "WW03.row.044", "speaker": "Mitchell", "text": "So it wasn't that much info."}, {"utterance_id": "WW03.row.045", "speaker": "Mike", "text": "Well..."}, {"utterance_id": "WW03.row.046", "speaker": "Justin", "text": "Were you were what you were when you woke up?"}, {"utterance_id": "WW03.row.047", "speaker": "James", "text": "No, I was a villager."}, {"utterance_id": "WW03.row.048", "speaker": "Mitchell", "text": "So you woke up as a villager? You went to sleep as an Insomniac and you woke up as a villager? Is that what you're claiming?"}, {"utterance_id": "WW03.row.049", "speaker": "James", "text": "There's no way that could happen."}, {"utterance_id": "WW03.row.050", "speaker": "Mike", "text": "Yes, it is. No, it's not."}, {"utterance_id": "WW03.row.051", "speaker": "James", "text": "That does not stand up in a court of law."}, {"utterance_id": "WW03.row.052", "speaker": "Mike", "text": "No, I was actually villager the whole time."}, {"utterance_id": "WW03.row.053", "speaker": "Mitchell", "text": "So why did you say, \"Insomniac\"?"}, {"utterance_id": "WW03.row.054", "speaker": "Mike", "text": "To see if anyone else would say it."}, {"utterance_id": "WW03.row.055", "speaker": "Justin", "text": "Guys, I think Mike is..."}, {"utterance_id": "WW03.row.056", "speaker": "Mitchell", "text": "Do we have a Tanner? No, we don't have a Tanner."}, {"utterance_id": "WW03.row.057", "speaker": "Justin", "text": "I think Mike might be a werewolf."}, {"utterance_id": "WW03.row.058", "speaker": "Mike", "text": "I am not a werewolf."}, {"utterance_id": "WW03.row.059", "speaker": "James", "text": "What did you steal?"}, {"utterance_id": "WW03.row.060", "speaker": "Mike", "text": "I think Mitchell."}, {"utterance_id": "WW03.row.061", "speaker": "Justin", "text": "He stole something very boring and I think I know what that means."}, {"utterance_id": "WW03.row.062", "speaker": "Mike", "text": "What'd you steal? Who'd you steal it from?"}, {"utterance_id": "WW03.row.063", "speaker": "Mitchell", "text": "I'm just going to go with \"boring\" for now."}, {"utterance_id": "WW03.row.064", "speaker": "Justin", "text": "Yeah, I think I know exactly..."}, {"utterance_id": "WW03.row.065", "speaker": "Mike", "text": "Did he steal from you?"}, {"utterance_id": "WW03.row.066", "speaker": "Justin", "text": "Yes."}, {"utterance_id": "WW03.row.067", "speaker": "Mike", "text": "I think he stole from me."}, {"utterance_id": "WW03.row.068", "speaker": "James", "text": "I don't..."}, {"utterance_id": "WW03.row.069", "speaker": "Mike", "text": "I think Justin's the werewolf."}, {"utterance_id": "WW03.row.070", "speaker": "James", "text": "No, I..."}, {"utterance_id": "WW03.row.071", "speaker": "Mike", "text": "No, I'm telling you."}, {"utterance_id": "WW03.row.072", "speaker": "James", "text": "I think this would be probably what the board position reflects now. Wait, but if you steal the Seer..."}, {"utterance_id": "WW03.row.073", "speaker": "Justin", "text": "You don't get the..."}, {"utterance_id": "WW03.row.074", "speaker": "Mike", "text": "You don't get to see... So that could be a boring steal."}, {"utterance_id": "WW03.row.075", "speaker": "Mitchell", "text": "Well, I didn't steal the Seer."}, {"utterance_id": "WW03.row.076", "speaker": "James", "text": "Okay."}, {"utterance_id": "WW03.row.077", "speaker": "Justin", "text": "Did you steal a villager?"}, {"utterance_id": "WW03.row.078", "speaker": "Mitchell", "text": "I stole a villager."}]}}, {"case_id": "WW04_WW04_r009", "observer_input_sha256": "e115870978d87b73715a67882e5ed352eda74326446175d584bf9da3f10fffb8", "observer_input": {"overall_task": "Participants discuss a One Night Ultimate Werewolf game after its night actions and decide whom to accuse or vote for. Statements about roles and actions are reports that may be disputed or strategic. Preserve the distinction between a reported initial role, a role after a reported exchange, and a current role. Use the publicly spoken instructions in this prefix for the variant; do not infer hidden cards or final votes.", "participants": [{"participant_id": "Audio", "known_role": "recorded_audio_not_player"}, {"participant_id": "James", "known_role": null}, {"participant_id": "Justin", "known_role": null}, {"participant_id": "Mitchell", "known_role": null}], "context_sources": [{"source_id": "WW04_public_instructions", "text": "Everyone, close your eyes. Werewolves, wake up and look for other werewolves\nIf there are no other werewolves, pick a card from the center.\nWerewolves close your eyes. Minion, wake up. Werewolves, stick out your thumb so the minion can see who you are. Werewolves, put your thumb away. Minion, close your eyes. Seer, wake up. You may look at another player's card or two of the center cards.\nSeer close your eyes. Robber, wake up. You may exchange your card with another player's card and then view your new card. Robber, close your eyes. Troublemaker, wake up. You may exchange cards between two other players. Troublemaker, close your eyes. Drunk, wake up and exchange your card with a card from the center. Drunk, close your eyes. Insomniac, wake up and look at your card. Insomniac, close your eyes. Everyone, keep your eyes closed and reach out and move your card around slightly. Everyone wake up.", "accessible_to_participants": ["James", "Justin", "Mitchell"], "adapter": {"kind": "game_rules", "review_status": "verified", "roles": ["Werewolf", "Villager", "Seer", "Robber", "Troublemaker", "Mason", "Drunk", "Insomniac", "Minion", "Tanner"]}}], "dialogue_prefix": [{"utterance_id": "WW04.row.001", "speaker": "Audio", "text": "Everyone, close your eyes. Werewolves, wake up and look for other werewolves"}, {"utterance_id": "WW04.row.002", "speaker": "James", "text": "What in the world is going on in this game?"}, {"utterance_id": "WW04.row.003", "speaker": "Audio", "text": "If there are no other werewolves, pick a card from the center."}, {"utterance_id": "WW04.row.004", "speaker": "Justin", "text": "I was thinking the exact same thing."}, {"utterance_id": "WW04.row.005", "speaker": "Audio", "text": "Werewolves close your eyes. Minion, wake up. Werewolves, stick out your thumb so the minion can see who you are. Werewolves, put your thumb away. Minion, close your eyes. Seer, wake up. You may look at another player's card or two of the center cards."}, {"utterance_id": "WW04.row.006", "speaker": "James", "text": "So many choices."}, {"utterance_id": "WW04.row.007", "speaker": "Audio", "text": "Seer close your eyes. Robber, wake up. You may exchange your card with another player's card and then view your new card. Robber, close your eyes. Troublemaker, wake up. You may exchange cards between two other players. Troublemaker, close your eyes. Drunk, wake up and exchange your card with a card from the center. Drunk, close your eyes. Insomniac, wake up and look at your card. Insomniac, close your eyes. Everyone, keep your eyes closed and reach out and move your card around slightly. Everyone wake up."}, {"utterance_id": "WW04.row.008", "speaker": "James", "text": "Okay. We're going to open with Justin and say I was the insomniac, but I woke up as a seer."}, {"utterance_id": "WW04.row.009", "speaker": "Mitchell", "text": "That makes no sense. I looked at two in the middle because I was the seer and I saw those two."}]}}, {"case_id": "WW05_WW05_r039", "observer_input_sha256": "c46568533ab7d023f158b2ad5528269f5d7f1df3f342513be1c660043be03447", "observer_input": {"overall_task": "Participants discuss a One Night Ultimate Werewolf game after its night actions and decide whom to accuse or vote for. Statements about roles and actions are reports that may be disputed or strategic. Preserve the distinction between a reported initial role, a role after a reported exchange, and a current role. Use the publicly spoken instructions in this prefix for the variant; do not infer hidden cards or final votes.", "participants": [{"participant_id": "Audio", "known_role": "recorded_audio_not_player"}, {"participant_id": "Justin", "known_role": null}, {"participant_id": "Paul", "known_role": null}, {"participant_id": "Mitchell", "known_role": null}], "context_sources": [{"source_id": "WW05_public_instructions", "text": "Close your eyes. Werewolves, wake up and look for other werewolves. If there is only one werewolf, you may look at a card from the center.\nWerewolves, close your eyes. Seer, wake up. You may look at another player's card.\nSeer, close your eyes.\nRobber exchange your card with another player's card and then view your new card.\nRobber, close your eyes.\nTroublemaker, wake up. You may exchange cards between two other players. Troublemaker, close your eyes. Everyone, keep your eyes closed and reach out and move your car around slightly.\nEveryone wake up.", "accessible_to_participants": ["Justin", "Paul", "Mitchell"], "adapter": {"kind": "game_rules", "review_status": "verified", "roles": ["Werewolf", "Villager", "Seer", "Robber", "Troublemaker", "Mason", "Drunk", "Insomniac", "Minion", "Tanner"]}}], "dialogue_prefix": [{"utterance_id": "WW05.row.001", "speaker": "Audio", "text": "Close your eyes. Werewolves, wake up and look for other werewolves. If there is only one werewolf, you may look at a card from the center."}, {"utterance_id": "WW05.row.002", "speaker": "Audio", "text": "Werewolves, close your eyes. Seer, wake up. You may look at another player's card."}, {"utterance_id": "WW05.row.003", "speaker": "Justin", "text": "I hope chat just likes looking at our crotches."}, {"utterance_id": "WW05.row.004", "speaker": "Audio", "text": "Seer, close your eyes."}, {"utterance_id": "WW05.row.005", "speaker": "Justin", "text": "Are you guys going to be gone when I open my eyes because..."}, {"utterance_id": "WW05.row.006", "speaker": "Audio", "text": "Robber exchange your card with another player's card and then view your new card."}, {"utterance_id": "WW05.row.007", "speaker": "Audio", "text": "Robber, close your eyes."}, {"utterance_id": "WW05.row.008", "speaker": "Paul", "text": "I like that cymbal."}, {"utterance_id": "WW05.row.009", "speaker": "Audio", "text": "Troublemaker, wake up. You may exchange cards between two other players. Troublemaker, close your eyes. Everyone, keep your eyes closed and reach out and move your car around slightly."}, {"utterance_id": "WW05.row.010", "speaker": "Audio", "text": "Everyone wake up."}, {"utterance_id": "WW05.row.011", "speaker": "Mitchell", "text": "I hate this happened the first time. I am the seer and I saw two werewolves or I'm a werewolf and I just saw a seer one or the other."}, {"utterance_id": "WW05.row.012", "speaker": "Justin", "text": "What were you, Paul?"}, {"utterance_id": "WW05.row.013", "speaker": "Paul", "text": "Something..."}, {"utterance_id": "WW05.row.014", "speaker": "Justin", "text": "You're a werewolf? You did this?"}, {"utterance_id": "WW05.row.015", "speaker": "Mitchell", "text": "I did this. I saw this. Right off the bat."}, {"utterance_id": "WW05.row.016", "speaker": "Justin", "text": "Like, you promise?"}, {"utterance_id": "WW05.row.017", "speaker": "Mitchell", "text": "I promise with everything in my heart."}, {"utterance_id": "WW05.row.018", "speaker": "Paul", "text": "I'll tell you this, Mitchell. I have a pretty good idea of what my card in front of me is right now. Yeah. So, that's all you get so far."}, {"utterance_id": "WW05.row.019", "speaker": "Justin", "text": "So if you were a werewolf, what would you say if I was a troublemaker and I switched you and Paul?"}, {"utterance_id": "WW05.row.020", "speaker": "Mitchell", "text": "I wouldn't say anything because I'm not werewolf. Did you switch us?"}, {"utterance_id": "WW05.row.021", "speaker": "Justin", "text": "I might have..."}, {"utterance_id": "WW05.row.022", "speaker": "Mitchell", "text": "No, I'm a...I wouldn't say anything."}, {"utterance_id": "WW05.row.023", "speaker": "Paul", "text": "Are you the troublemaker? Is that what you're saying?"}, {"utterance_id": "WW05.row.024", "speaker": "Justin", "text": "I might be. And are you the villager? Because I think that was the implication of what your statement was."}, {"utterance_id": "WW05.row.025", "speaker": "Paul", "text": "I wasn't a werewolf, I'll tell you that much."}, {"utterance_id": "WW05.row.026", "speaker": "Justin", "text": "Well can you confirm anyone's story here? That's the question."}, {"utterance_id": "WW05.row.027", "speaker": "Paul", "text": "I'm not going to answer that question, but I'll say that so far, I couldn't say for sure that anyone is lying."}, {"utterance_id": "WW05.row.028", "speaker": "Justin", "text": "Cool."}, {"utterance_id": "WW05.row.029", "speaker": "Paul", "text": "That's all I know."}, {"utterance_id": "WW05.row.030", "speaker": "Mitchell", "text": "He can't unconfirm my story."}, {"utterance_id": "WW05.row.031", "speaker": "Paul", "text": "I can't unconfirm a story."}, {"utterance_id": "WW05.row.032", "speaker": "Justin", "text": "All right. So we should just vote to kill Mitchell."}, {"utterance_id": "WW05.row.033", "speaker": "Mitchell", "text": "Nope."}, {"utterance_id": "WW05.row.034", "speaker": "Paul", "text": "But if he's the seer..."}, {"utterance_id": "WW05.row.035", "speaker": "Justin", "text": "Yeah. I want to see him defend himself."}, {"utterance_id": "WW05.row.036", "speaker": "Mitchell", "text": "Uhhh, we still have two werewolves, dude. Don't kill me. We're good. We got all of us on the same team."}, {"utterance_id": "WW05.row.037", "speaker": "Paul", "text": "Oh, I think Mitchell is one of the werewolves."}, {"utterance_id": "WW05.row.038", "speaker": "Justin", "text": "I think Mitchell is. But then again, that would mean that you would be the werewolf because I switched you two."}, {"utterance_id": "WW05.row.039", "speaker": "Paul", "text": "You switched us?"}]}}, {"case_id": "WW06_WW06_r040", "observer_input_sha256": "f7176fcd6db843868e89ebf243541b44deabc67416be3e98579e880cd097bfb9", "observer_input": {"overall_task": "Participants discuss a One Night Ultimate Werewolf game after its night actions and decide whom to accuse or vote for. Statements about roles and actions are reports that may be disputed or strategic. Preserve the distinction between a reported initial role, a role after a reported exchange, and a current role. Use the publicly spoken instructions in this prefix for the variant; do not infer hidden cards or final votes.", "participants": [{"participant_id": "Audio", "known_role": "recorded_audio_not_player"}, {"participant_id": "James", "known_role": null}, {"participant_id": "Justin", "known_role": null}, {"participant_id": "Mitchell", "known_role": null}, {"participant_id": "Paul", "known_role": null}, {"participant_id": "Laura", "known_role": null}], "context_sources": [{"source_id": "WW06_public_instructions", "text": "Everyone, close your eyes. Werewolves, wake up and look for other Werewolves. If there is only one Werewolf, you may look at a card from the center.\nWerewolves, close your eyes. Seer, wake up. You may look at another player's card or two of the center cards. Seer, close your eyes. Robber, wake up. You may exchange your card with another player's card and then view your new card. Robber, close your eyes. Troublemaker, wake up. You may exchange cards between two other players. Troublemaker, close your eyes. Insomniac, wake up and look at your card. Insomniac, close your eyes. Everyone, keep your eyes closed and reach out and move your card around slightly,\nEveryone, wake up.", "accessible_to_participants": ["James", "Justin", "Mitchell", "Paul", "Laura"], "adapter": {"kind": "game_rules", "review_status": "verified", "roles": ["Werewolf", "Villager", "Seer", "Robber", "Troublemaker", "Mason", "Drunk", "Insomniac", "Minion", "Tanner"]}}], "dialogue_prefix": [{"utterance_id": "WW06.row.001", "speaker": "Audio", "text": "Everyone, close your eyes. Werewolves, wake up and look for other Werewolves. If there is only one Werewolf, you may look at a card from the center."}, {"utterance_id": "WW06.row.002", "speaker": "James", "text": "Is this disco-Halloween?"}, {"utterance_id": "WW06.row.003", "speaker": "Audio", "text": "Werewolves, close your eyes. Seer, wake up. You may look at another player's card or two of the center cards. Seer, close your eyes. Robber, wake up. You may exchange your card with another player's card and then view your new card. Robber, close your eyes. Troublemaker, wake up. You may exchange cards between two other players. Troublemaker, close your eyes. Insomniac, wake up and look at your card. Insomniac, close your eyes. Everyone, keep your eyes closed and reach out and move your card around slightly,"}, {"utterance_id": "WW06.row.004", "speaker": "Justin", "text": "Man. Did anyone else feel like they were falling when their eyes were closed?"}, {"utterance_id": "WW06.row.005", "speaker": "James", "text": "No."}, {"utterance_id": "WW06.row.006", "speaker": "Audio", "text": "Everyone, wake up."}, {"utterance_id": "WW06.row.007", "speaker": "Mitchell", "text": "Did we ever figure..."}, {"utterance_id": "WW06.row.008", "speaker": "Paul", "text": "No, but that does have that happened to me once here."}, {"utterance_id": "WW06.row.009", "speaker": "James", "text": "Did we ever figure out why he says, one night fever."}, {"utterance_id": "WW06.row.010", "speaker": "Justin", "text": "Just Easter eggs. All right. So these are the tokens we can use to represent people. So Paul is saying he was a villager."}, {"utterance_id": "WW06.row.011", "speaker": "Paul", "text": "I was the villager. I have no information."}, {"utterance_id": "WW06.row.012", "speaker": "Mitchell", "text": "I was insomniac."}, {"utterance_id": "WW06.row.013", "speaker": "Laura", "text": "I was villager."}, {"utterance_id": "WW06.row.014", "speaker": "Mitchell", "text": "Dude. I can hear you move quite a bit during the night."}, {"utterance_id": "WW06.row.015", "speaker": "James", "text": "Yeah, well that's cause I was dancing."}, {"utterance_id": "WW06.row.016", "speaker": "Justin", "text": "I tend to move the whole time."}, {"utterance_id": "WW06.row.017", "speaker": "Paul", "text": "I'm erratic."}, {"utterance_id": "WW06.row.018", "speaker": "Justin", "text": "So James and I, what did you, did you wake up? We'll wait to see what James and I say."}, {"utterance_id": "WW06.row.019", "speaker": "Mitchell", "text": "Well, I can tell you."}, {"utterance_id": "WW06.row.020", "speaker": "Paul", "text": "Mitchell, if you want to talk, now you go ahead."}, {"utterance_id": "WW06.row.021", "speaker": "James", "text": "Last I saw that was the situation."}, {"utterance_id": "WW06.row.022", "speaker": "Justin", "text": "So you were the Robber."}, {"utterance_id": "WW06.row.023", "speaker": "James", "text": "I was."}, {"utterance_id": "WW06.row.024", "speaker": "Justin", "text": "And you stole from him."}, {"utterance_id": "WW06.row.025", "speaker": "James", "text": "I did. And I was disappointed and I was like fuck, witness protection."}, {"utterance_id": "WW06.row.026", "speaker": "Justin", "text": "All right. Well, I can confirm James's story that he was the Robber."}, {"utterance_id": "WW06.row.027", "speaker": "Mitchell", "text": "All right. I woke up as myself."}, {"utterance_id": "WW06.row.028", "speaker": "James", "text": "Boring."}, {"utterance_id": "WW06.row.029", "speaker": "Justin", "text": "Boring. Is this really?"}, {"utterance_id": "WW06.row.030", "speaker": "James", "text": "Is this real life because is this just a fuzzy wuzzy?"}, {"utterance_id": "WW06.row.031", "speaker": "Justin", "text": "This is a fuzzy wuzzy?"}, {"utterance_id": "WW06.row.032", "speaker": "Mitchell", "text": "Here's what could happen? I could be Werewolf because I have no alibi. He also could be."}, {"utterance_id": "WW06.row.033", "speaker": "Justin", "text": "I could be."}, {"utterance_id": "WW06.row.034", "speaker": "Mitchell", "text": "Who else could be."}, {"utterance_id": "WW06.row.035", "speaker": "Justin", "text": "James and I could both be Werewolves."}, {"utterance_id": "WW06. ht?"}, {"utterance_id": "WW10.row.014", "speaker": "Katie", "text": "So, I just took a little snooze-fest, and then I woke up and I might have taken something that didn't belong to me. But you know what? I earned it because I've worked here the longest, by tarnation."}, {"utterance_id": "WW10.row.015", "speaker": "Brett", "text": "When did we become so southern?"}, {"utterance_id": "WW10.row.016", "speaker": "Katie", "text": "You started off saying-"}, {"utterance_id": "WW10.row.017", "speaker": "DeAndre", "text": "By tarnation."}, {"utterance_id": "WW10.row.018", "speaker": "Katie", "text": "By tarnation, I earned it."}, {"utterance_id": "WW10.row.019", "speaker": "DeAndre", "text": "But what you do last night?"}, {"utterance_id": "WW10.row.020", "speaker": "Brett", "text": "I did nothing, but you know me in my drinking habits. So, I might have sleepwalked, and exchange something from the center."}, {"utterance_id": "WW10.row.021", "speaker": "Katie", "text": "From the center?"}, {"utterance_id": "WW10.row.022", "speaker": "Brett", "text": "From the center."}, {"utterance_id": "WW10.row.023", "speaker": "Katie", "text": "You are so southern."}, {"utterance_id": "WW10.row.024", "speaker": "Brett", "text": "I was drunk."}, {"utterance_id": "WW10.row.025", "speaker": "Katie", "text": "Interesting."}, {"utterance_id": "WW10.row.026", "speaker": "Brett", "text": "I maybe a CEO, but I have my flaws, okay?"}, {"utterance_id": "WW10.row.027", "speaker": "Katie", "text": "Yeah, you're just an alcoholic. That's fine."}, {"utterance_id": "WW10.row.028", "speaker": "Brett", "text": "I'm on my diet, and my diet's getting... Okay. What'd you do last night?"}, {"utterance_id": "WW10.row.029", "speaker": "DeAndre", "text": "Well, I woke up. It's interesting you say that because I woke up, and I also exchanged a card from the center."}, {"utterance_id": "WW10.row.030", "speaker": "Katie", "text": "Interesting. So, we have two people claiming to be drunk. Drunk!"}, {"utterance_id":     const c = current(); const r = review(); const o = c.observer_input;
    const completed = CASES.filter(x => state.reviews[x.case_id].review_metadata.prefix_first_review_completed).length;
    const app = document.getElementById('app'); app.replaceChildren();
    app.append(el('header', {className: 'masthead'}, el('div', {}, el('div', {className: 'eyebrow'}, 'CIM / Tier S'),
      el('h1', {}, 'Consequential Interpretation Mismatch'), p('Read the same frozen prefix, record each participant’s supported interpretation, and compare task consequences.', 'subhead')),
      el('div', {className: 'toolbar'}, fileButton('Import REVIEWS.json', '.json,application/json', importReviews), button('Download REVIEWS.json', exportReviews, 'primary'),
        el('span', {id: 'save-note', className: 'save-note'}, state.dirty ? 'Unsaved changes · Download before closing.' : 'Local, in-memory editing · No automatic saving'))));
    app.append(el('div', {className: 'statusline'}, el('span', {id: 'notice', className: 'notice ' + state.noticeType}, state.notice),
      el('span', {className: 'badge'}, completed + ' / ' + CASES.length + ' first passes recorded')));
    const nav = el('nav', {className: 'case-nav', 'aria-label': 'Candidate episodes'}, CASES.map((x, index) => {
      const label = x.case_id.split('_')[0]; const rr = state.reviews[x.case_id];
      return button('', () => switchCase(index), 'case-button', {'aria-current': String(index === state.current), 'aria-label': 'Review ' + x.case_id});
    }));
    [...nav.children].forEach((btn, index) => { const x = CASES[index]; const rr = state.reviews[x.case_id]; btn.append(el('span', {}, x.case_id.split('_')[0]), el('span', {className: 'dot'}, rr.review_metadata.prefix_first_review_completed ? '✓' : rr.provisional_label ? 'draft' : '—')); });
    const sidebar = el('aside', {className: 'sidebar'}, el('h2', {}, CASES.length + ' candidates'), nav, p('Candidates are not confirmed selections. Keep each reader’s file separate.', 'footer-note'));
    const titlebar = el('div', {className: 'casebar'}, el('div', {}, el('h2', {}, c.case_id.split('_')[0]),
      el('div', {className: 'case-detail'}, c.case_id + ' · ' + o.dialogue_prefix.length + ' prefix turns')),
      el('div', {className: 'case-actions'}, button('← Previous', () => switchCase(state.current - 1), 'small', {disabled: state.current === 0}), button('Next →', () => switchCase(state.current + 1), 'small', {disabled: state.current === CASES.length - 1})));
    const form = el('section', {className: 'panel', 'aria-label': 'Human review fields'},
      el('div', {className: 'panel-head'}, el('div', {className: 'eyebrow'}, 'Your research annotation'), el('h2', {}, 'Make the evidence explicit'),
        p('Downloaded JSON uses the reference-key format. Controlled codes stay unchanged.', 'hint')),
      metadataSection(), focusSection(c), readingsSection(c), tasksSection(c), decisionSection(), completionSection());
    const workspace = el('main', {className: 'workspace'}, titlebar, el('div', {className: 'columns'}, evidencePanel(c), el('div', {}, form, wordingSection(c))),
      p('JSON import preserves unknown fields. This editor makes no network requests and stores no browser copy. Download your review before leaving; use the package validator for the complete schema and eligibility checks.', 'footer-note'));
    app.append(el('div', {className: 'layout'}, sidebar, workspace));
  }
  window.addEventListener('beforeunload', e => { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });
  render();
})();
</script></body></html>
